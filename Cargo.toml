[workspace]
members = [
    "crates/dofek-plugin-protocol",
    "gui",
    "plugins/dofek-ollama",
    "plugins/dofek-docker",
    "plugins/dofek-net-ping",
]

[package]
name = "dofek"
version = "1.5.1"
edition = "2024"
description = "Terminal-native system monitor for Windows, Linux, and macOS (Apple Silicon) — AI-aware, visually stunning"

[[bin]]
name = "dofek-tui"
path = "src/main.rs"

# Misbehaving-plugin fixture for the plugin-runtime tests. Default-off so it
# never lands in a release build; CI enables it via `--all-features`.
[[bin]]
name = "dofek-mock-plugin"
path = "src/bin/dofek-mock-plugin.rs"
required-features = ["mock-plugin"]

[lib]
name = "dofek"
path = "src/lib.rs"

[features]
mock-plugin = []

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# HTTP client (blocking, no TLS needed — LHM is localhost only)
ureq = { version = "2", features = ["native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# NVIDIA GPU (dynamic loading — gracefully fails if no NVIDIA)
nvml-wrapper = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# System info (CPU, memory, processes — no elevation needed)
sysinfo = "0.39"

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"
dirs = "6.0.0"
uuid = { version = "1", features = ["v4"] }

# Plugin protocol — shared with plugins/* and external authors.
dofek-plugin-protocol = { path = "crates/dofek-plugin-protocol", version = "0.1.0" }

# Local time formatting (cross-platform; replaces the OS-specific clock blocks)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# Scratch dirs for tests that exercise plugin install / command resolution.
tempfile = "3"

# Integration tests don't inherit normal dependencies, and the containment
# test needs `kill(pid, None)` to ask whether a grandchild is still alive.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(unix)'.dependencies]
# `process` is needed for setsid/getpgid: plugin children are put in their own
# session so `killpg` reaps any grandchildren they spawn.
nix = { version = "0.31", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_System_Performance",
    "Wdk_System_SystemServices",
    # Job Objects contain plugin children so their own children can't orphan.
    "Win32_System_JobObjects",
] }

# Embeds VERSIONINFO into dofek-tui.exe — see build.rs. For build dependencies
# this `cfg` is evaluated against the *host*, so the crate is only fetched when
# building on Windows and non-Windows builds are untouched.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
opt-level = 3
