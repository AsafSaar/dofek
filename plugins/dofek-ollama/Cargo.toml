[package]
name = "dofek-ollama"
version = "0.1.0"
edition = "2024"
description = "Dofek plugin: Ollama model status and inference tracking"

[[bin]]
name = "dofek-ollama"
path = "src/main.rs"

[dependencies]
dofek-plugin-protocol = { path = "../../crates/dofek-plugin-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }

# Embeds VERSIONINFO — see build.rs. Host-gated: only fetched on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
