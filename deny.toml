# cargo-deny configuration. Run locally with:
#   cargo install cargo-deny && cargo deny check
#
# CI runs this on every push/PR and on a weekly cron, so advisories published
# against unchanged code still surface.

[graph]
# Only the platforms dofek actually ships. Without this, cargo-deny walks
# dependency trees for targets we never build, producing findings that can't
# affect a released binary.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
# No blanket ignores. If one becomes necessary, list the RUSTSEC id here with
# a comment saying why it doesn't apply and when to revisit.
ignore = []

[licenses]
version = 2
# Permissive licences compatible with shipping MIT-licensed binaries.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are near-unavoidable in a tree this size (Tauri and
# ratatui pull overlapping ecosystems), so warn rather than fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
